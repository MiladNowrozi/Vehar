services:
  mysql:
    image: focker.ir/mysql:8.0.28
    environment:
      MYSQL_ROOT_PASSWORD: 927649
    ports:
      - 3306:3306
    volumes:
      - /root/home/mysql-db:/var/lib/mysql
  backend:
    build:
      context: ./back_end
    env_file:
      - ./back.env
    ports:
      - 5000:5000
    restart: always
    depends_on:
      - mysql
    volumes:
      - /root/home/uploads:/app/uploads
  nginx:
    build:
      context: ./front_end
      args:
       REACT_APP_BASE_URL: http://87.107.105.139/api

    volumes:
      - ./front_end/build:/usr/share/nginx/html
      - /root/home/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

    depends_on:
      - backend