
services:
  backend:
    image: focker.ir/node:18
    command: npm start
    working_dir: /app
    volumes:
      - ./back_end:/app
    ports:
      - 5000:5000
    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PORT: 3306
      DB_PASSWORD: 927649
      DB_NAME: vehar
    restart: always

  nginx:
    image: focker.ir/nginx:latest
    ports:
      - 80:80
    environment:
    - REACT_APP_BASE_URL = http://localhost/api
    volumes:
      - ./front_end/build:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/sites-available/default
    depends_on:
     - backend