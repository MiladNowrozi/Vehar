name: Deploy to VPS

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    outputs:
      newer_version: ${{ steps.version_check.outputs.newer_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get previous and current tag
        id: version_check
        run: |
          TAGS=$(git tag --sort=-creatordate)
          NEW_TAG=$(echo "$TAGS" | head -n1)
          OLD_TAG=$(echo "$TAGS" | sed -n 2p)

          echo "🟡 NEW_TAG=$NEW_TAG"
          echo "🟡 OLD_TAG=$OLD_TAG"

          if [ "$NEW_TAG" != "$OLD_TAG" ]; then
            echo "newer_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "newer_version=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Set up SSH key
        if: steps.version_check.outputs.newer_version == 'true'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        if: steps.version_check.outputs.newer_version == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p 9011 87.107.105.139 >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        if: steps.version_check.outputs.newer_version == 'true'
        run: |
          ssh -p 9011 root@87.107.105.139 'bash -s' < ./deploy.sh
